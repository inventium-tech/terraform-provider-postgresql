name: build
run-name: '🛠️ Build - ${{ github.ref_name }}'

on:
  push:
    branches:
      - main
      - dev
  pull_request_target:
    branches:
      - main
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 💻
        uses: actions/checkout@v4.2.2

      - name: Setup Go environment ⚙️
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Pkg Install 📦
        run: go mod download

      - name: Go Build 🛠️
        run: go build -v ./...

  test-unit:
    name: Go Unit Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.21'
          - '1.22'
    needs:
      - build
    steps:
      - name: Checkout 💻
        uses: actions/checkout@v4.2.2

      - name: Setup Go environment ⚙️
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Go Pkg Install 📦
        run: go mod download

      - name: Go Unit Test 🧪
        run: go test ./... -v -coverprofile=unit-test.lcov -json > unit-test.log

      - name: Upload Unit Test Artifacts ⏫
        uses: actions/upload-artifact@v4.6.2
        if: ${{ success() }}
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            unit-test.lcov
            unit-test.log
          retention-days: 7
          overwrite: true
          compression-level: 1 # best speed

  test-acc:
    name: Go Acceptance Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf-version:
          - '1.9.*'
          - '1.10.*'
          - '1.11.*'
    steps:
      - name: Checkout 💻
        uses: actions/checkout@v4.2.2

      - name: Setup Go environment ⚙️
        uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.21'

      - name: Terraform Setup 🏗️
        uses: hashicorp/setup-terraform@v3.1.1
        with:
          terraform_version: ${{ matrix.tf-version }}
          terraform_wrapper: false

      - name: Go Acceptance Test 🧪
        run: go test ./internal/provider -v -coverprofile=acc-test.lcov -json > acc-test.log
        env:
          TF_ACC: '1'

      - name: Upload coverage reports to Codecov ☂️
        uses: codecov/codecov-action@v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          files: unit-test.lcov,acc-test.lcov

      - name: Upload Acceptance Test Artifacts ⏫
        uses: actions/upload-artifact@v4.6.2
        if: ${{ success() }}
        with:
          name: acc-test-reports-${{ github.sha }}
          path: |
            acc-test.lcov
            acc-test.log
          retention-days: 7
          overwrite: true
          compression-level: 1 # best speed

  generate:
    name: Go Generate
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit
      - test-acc
    steps:
      - name: Checkout 💻
        uses: actions/checkout@v4.2.2

      - name: Setup Go environment ⚙️
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Generate 📜
        run: go generate ./...

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit
      - test-acc
    steps:
      - name: Checkout 💻
        uses: actions/checkout@v4.2.2
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Download Unit Test Artifact ⏬
        uses: actions/download-artifact@v4.3.0
        with:
          name: unit-test-reports-${{ github.sha }}

      - name: Download Acceptance Test Artifact ⏬
        uses: actions/download-artifact@v4.3.0
        with:
          name: acc-test-reports-${{ github.sha }}

      - name: SonarCloud Scan 🎯
        uses: SonarSource/sonarqube-scan-action@v5.2.0 # See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
